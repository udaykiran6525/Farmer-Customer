# Farmigo Spring Boot + MySQL Configuration
server.port=${PORT:5000}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmigo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (30 days expiration)
jwt.secret=${JWT_SECRET:farmigo_super_secret_jwt_key_2024_production_spring_boot_secure_key}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:degvfsiys}
cloudinary.api-key=${CLOUDINARY_API_KEY:221732397869671}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:z4ItXKYn0tYn616DpNHCe1w79Ts}

# Frontend & CORS Configuration
frontend.url=${FRONTEND_URL:https://farmercustomer.vercel.app}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://farmercustomer.vercel.app,https://farmercustomer.vercel.app/,https://farmer-customer.onrender.com,https://farmer-customer.onrender.com/,http://localhost:3000,http://localhost:5000,http://localhost:5173,http://127.0.0.1:5500,http://127.0.0.1:3000,http://127.0.0.1:5173}

